name: Harvest wallpaper sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a06e8f-vaultscreen-8k

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pillow
          ffmpeg -version | head -1

      - name: Run harvest
        run: python work/harvest.py
        continue-on-error: true

      - name: Commit thumbs
        run: |
          git config user.name "harvest-bot"
          git config user.email "harvest-bot@users.noreply.github.com"
          git add -f work/thumbs work/manifest.json || true
          git commit -m "harvest: source thumbnails + manifest" || echo "nothing to commit"
          git push origin HEAD:arena/01a06e8f-vaultscreen-8k

      - name: Upload raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-downloads
          path: work/downloads
          retention-days: 1
          if-no-files-found: warn
